name: Debug Google Form

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/debug-form.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test Google Form submission endpoint
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse
          url='https://docs.google.com/forms/d/e/1FAIpQLSd78wRIkBdAdrs4onfWtHy7EdJoy3WTlrAbU6h6GdrJ2ajDPw/formResponse'
          fields={
            'entry.850844116':'DIAGNOSTIC TEST - Q1',
            'entry.599675901':'DIAGNOSTIC TEST - Promise',
            'entry.1862870986':'DIAGNOSTIC TEST - Q3',
            'entry.1093925353':'DIAGNOSTIC TEST - Other',
            'entry.619739119':'DIAGNOSTIC TEST - Q4',
            'entry.469107767':'DIAGNOSTIC TEST - Q5',
            'entry.273249912':'DIAGNOSTIC TEST - Q6',
            'entry.1382366052':'DIAGNOSTIC TEST - Feedback',
          }
          data=urllib.parse.urlencode(fields).encode()
          req=urllib.request.Request(url,data=data,headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/x-www-form-urlencoded'})
          try:
            r=urllib.request.urlopen(req,timeout=30)
            print('status',r.status)
            print('final_url',r.geturl())
            print(r.read(500).decode('utf-8','replace'))
          except Exception as e:
            print('ERROR',repr(e))
            raise
          PY
